name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev-${GITHUB_SHA::7}}"
          cp android/app/build/outputs/apk/release/app-release.apk "gymapp-${VERSION}.apk"
          echo "APK_PATH=gymapp-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymapp-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GymApp ${{ github.ref_name }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          body: |
            APK de GymApp ${{ github.ref_name }}.

            **Instalación:** descargá el APK y habilitalo desde "Instalar apps desconocidas" en Android.
            Funciona sin conexión y guarda los datos localmente con SQLite.
